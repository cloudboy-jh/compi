[package]
name = "compi-setup"
version = "0.2.0"
edition = "2024"
publish = false

[workspace]

[target.'cfg(windows)'.dependencies]
compi-client = { path = "../../crates/compi-client" }
compi-protocol = { path = "../../crates/compi-protocol" }
compi-update = { path = "../../crates/compi-update" }
async-channel = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
# The same GPUI as compi-client. Two GPUI versions each embed a Windows manifest,
# and the duplicate resource fails the link. gpui-pre-windows embeds it.
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
