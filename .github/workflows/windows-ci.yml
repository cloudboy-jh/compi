name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Locate Windows SDK shader compiler
        shell: pwsh
        run: |
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $fxc = Get-ChildItem -Path $sdkRoot -Filter fxc.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\fxc\.exe$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if (-not $fxc) {
            throw "fxc.exe was not found below $sdkRoot"
          }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $($fxc.FullName)"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run workspace unit and example tests
        run: cargo test --locked --workspace --lib --bins --examples

      - name: Run wire and terminal boundary integration tests
        shell: pwsh
        run: |
          cargo test --locked -p compi-protocol --test wire_v7
          if ($LASTEXITCODE -ne 0) { throw 'Wire compatibility tests failed' }
          cargo test --locked -p compi-server --test terminal_compatibility
          if ($LASTEXITCODE -ne 0) { throw 'Terminal boundary tests failed' }

      - name: Run real daemon regressions when WSL is qualified
        shell: pwsh
        run: |
          wsl.exe --exec true
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'MISSING COVERAGE: no working default WSL distribution; daemon runtime tests were not run.'
            'WSL runtime: **unverified** — no working default distribution on this runner.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          cargo test --locked -p compi-server --test daemon_integration
          if ($LASTEXITCODE -ne 0) { throw 'Windows/WSL daemon regressions failed' }
          'WSL runtime: daemon integration regressions passed on this runner.' >> $env:GITHUB_STEP_SUMMARY

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Verify product binaries
        shell: pwsh
        run: |
          $expected = @('compi.exe', 'compi-daemon.exe')
          $actual = Get-ChildItem target\release -File -Filter *.exe | Select-Object -ExpandProperty Name | Sort-Object
          $difference = Compare-Object ($expected | Sort-Object) $actual
          if ($difference) {
            $difference | Format-Table | Out-String | Write-Host
            throw "target/release does not contain exactly the product executables"
          }

      - name: Build installer distribution
        shell: pwsh
        run: .\tools\build-installer.ps1
