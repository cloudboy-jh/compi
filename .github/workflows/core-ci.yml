name: Core CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    # Windows runs serialized WSL regressions and a separate release daemon build.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    env:
      # CI reads panic messages, not debuggers: no debug info makes debug builds compile
      # and link faster and keeps the cache small (Windows writes large PDBs).
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Check production dependency boundaries
        run: python tools/check-dependencies.py --target ${{ matrix.target }}
      - name: Provision default WSL2 distribution
        if: runner.os == 'Windows'
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          wsl-version: '2'
      - name: Require working WSL runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wsl.exe --exec /bin/bash -lc true
          if ($LASTEXITCODE -ne 0) { throw 'A working default WSL2 distribution is required for Windows daemon tests' }
      - name: Prepare pinned Microsoft ConPTY runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\prepare-conpty.ps1
      - name: Lint all workspace targets
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run workspace unit and binary tests
        # Setup's tests run on their own, one at a time; see docs/dev/testcmds.md.
        run: cargo test --locked --workspace --exclude compi-setup --lib --bins
      - name: Verify daemon stdio relay
        run: cargo test --locked -p compi-daemon --test stdio_relay
      - name: Verify engine-to-wire conversion and replica recovery
        run: cargo test --locked -p compi-daemon --test terminal_compatibility
      - name: Build headless native daemon and development probe
        run: |
          cargo build --locked -p compi-daemon --bin compi-daemon
          cargo build --locked -p compi-client --example compi-probe
      - name: Run real Unix PTY and persistent daemon regressions
        env:
          COMPI_TERMINAL_TRACE_DIR: ${{ runner.temp }}/compi-terminal-traces
        if: runner.os != 'Windows'
        run: cargo test --locked -p compi-daemon --test unix_daemon_integration
      - name: Run Windows daemon regressions
        if: runner.os == 'Windows'
        env:
          COMPI_TERMINAL_TRACE_DIR: ${{ runner.temp }}/compi-terminal-traces
        shell: pwsh
        run: |
          # The hosted WSL2 guest cannot reliably start many test shells at once.
          cargo test --locked -p compi-daemon --test daemon_integration -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows/WSL daemon regressions failed' }
      - name: Build real Windows daemon without graphics setup
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p compi-daemon --bin compi-daemon
      - name: Preserve failed terminal runtime traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: terminal-traces-${{ matrix.os }}
          path: ${{ runner.temp }}/compi-terminal-traces
          if-no-files-found: ignore

  # Builds what the release's Windows job builds, with its cache key, so a tag starts warm:
  # caches a tag saves are invisible to later tags, so only main's count.
  windows-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          workspaces: |
            . -> target/installer/product
            . -> target/installer/diagnostics
      - name: Prepare pinned Microsoft ConPTY runtime
        shell: pwsh
        run: .\tools\prepare-conpty.ps1
      - name: Build the release binaries and Setup
        run: cargo build --locked --release -p compi-client -p compi-daemon -p compi-update -p compi-setup --bins --target-dir target/installer/product
      - name: Build package smoke diagnostics
        run: cargo build --locked -p compi-client -p compi-daemon -p compi-update --bins --examples --target-dir target/installer/diagnostics

  # The macOS release job's build, with its cache key; see windows-release-cache.
  macos-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          workspaces: . -> target/macos-release/product
      - name: Build the release binaries and the bundle check's probe
        run: cargo build --locked --release --target aarch64-apple-darwin --target-dir target/macos-release/product -p compi-client -p compi-daemon -p compi-update --bins --example compi-probe

  mac-client:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the native Mac client and sibling daemon
        run: cargo build --locked -p compi-client -p compi-daemon --bins
