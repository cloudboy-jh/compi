name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPI_UPDATE_PUBLIC_KEY: ${{ vars.COMPI_UPDATE_PUBLIC_KEY }}
  COMPI_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check release notes match the tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          heading=$(head -n 1 docs/release-notes.md | tr -d '\r')
          test "$heading" = "# ${RELEASE_TAG#v}" || { echo "docs/release-notes.md must start with '# ${RELEASE_TAG#v}', found '$heading'"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/installer/product
            installer/bootstrapper -> ../../target/installer/bootstrapper-target
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Provision default WSL2 distribution
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          wsl-version: '2'
      - name: Prepare pinned Microsoft ConPTY runtime
        shell: pwsh
        run: .\tools\prepare-conpty.ps1
      - name: Verify source and runtime prerequisites
        shell: pwsh
        run: |
          wsl.exe --exec /bin/bash -lc true
          if ($LASTEXITCODE -ne 0) { throw 'A working default WSL2 distribution is required' }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked -p compi-protocol -p compi-daemon -p compi-client -p compi-update -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          python tools/check-dependencies.py --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency boundaries failed' }
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX_BASE64 -and -not $env:SIGNING_PFX_PASSWORD) {
            Write-Host 'No publisher credentials configured; Windows artifacts will be unsigned'
            exit 0
          }
          if (-not $env:SIGNING_PFX_BASE64 -or -not $env:SIGNING_PFX_PASSWORD) {
            throw 'Configure both Windows signing secrets, or neither'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'compi-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate.Thumbprint) { throw 'Signing certificate import failed' }
            "COMPI_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }
      - name: Build Windows distribution
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $officialRelease = [bool]$env:EXPECTED_TAG
          .\tools\build-installer.ps1 -SigningCertificateThumbprint $env:COMPI_SIGNING_THUMBPRINT -ExpectedTag $env:EXPECTED_TAG -RequireUpdateKey:$officialRelease
          Rename-Item target/distribution/SHA256SUMS.txt SHA256SUMS-Windows-x64.txt
      - name: Verify portable artifact
        shell: pwsh
        run: .\tools\smoke-windows-distribution.ps1
      - name: Remove imported publisher certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:COMPI_SIGNING_THUMBPRINT) {
            Remove-Item "Cert:\CurrentUser\My\$env:COMPI_SIGNING_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
      - name: Preserve Windows packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaging-diagnostics
          path: target/distribution-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-Windows-x64
          path: target/distribution/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target/macos-release/product
      - name: Configure Developer ID and notarization
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          names = ['CERTIFICATE', 'CERTIFICATE_PASSWORD', 'SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_TEAM_ID', 'APPLE_PASSWORD']
          configured = [bool(os.environ.get(name)) for name in names]
          if any(configured) and not all(configured):
              raise SystemExit('Configure all six Developer ID/notarization secrets, or none')
          if all(configured):
              import base64
              from pathlib import Path
              Path(os.environ['RUNNER_TEMP'], 'compi-signing.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE'], validate=True))
          PY
          if [[ -z "$CERTIFICATE" ]]; then
            echo 'No Developer ID credentials configured; macOS artifacts will be ad-hoc signed and not notarized'
            exit 0
          fi
          keychain="$RUNNER_TEMP/compi-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/compi-signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials compi-release --keychain "$keychain" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD"
          printf 'COMPI_MACOS_SIGNING_IDENTITY=%s\nCOMPI_MACOS_NOTARY_PROFILE=compi-release\nCOMPI_MACOS_NOTARY_KEYCHAIN=%s\n' "$SIGNING_IDENTITY" "$keychain" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/compi-signing.p12"
      - name: Build macOS distribution
        env:
          EXPECTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          arguments=()
          if [[ -n "$EXPECTED_TAG" ]]; then arguments+=(--expected-tag "$EXPECTED_TAG" --require-update-key); fi
          bash tools/build-macos.sh "${arguments[@]}"
          mv target/distribution/SHA256SUMS.txt target/distribution/SHA256SUMS-macOS-arm64.txt
      - name: Verify copied macOS bundle
        shell: bash
        run: |
          set -o pipefail
          MACOSX_DEPLOYMENT_TARGET=14.0 cargo build --locked --release --target aarch64-apple-darwin --target-dir target/macos-release/product -p compi-client --example compi-probe
          mkdir -p target/distribution-smoke
          bash tools/smoke-macos-bundle.sh target/distribution/Compi-*-macOS-arm64.dmg target/macos-release/product/aarch64-apple-darwin/release/examples/compi-probe 2>&1 | tee target/distribution-smoke/macos-bundle.log
      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/compi-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/compi-signing.p12"
      - name: Preserve macOS packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-packaging-diagnostics
          path: target/distribution-smoke/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-macOS-arm64
          path: target/distribution/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: distribution
      - name: Combine and verify checksums
        working-directory: distribution
        run: |
          cat SHA256SUMS-Windows-x64.txt SHA256SUMS-macOS-arm64.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          rm SHA256SUMS-Windows-x64.txt SHA256SUMS-macOS-arm64.txt
      - name: Sign verified native release metadata
        env:
          COMPI_UPDATE_SIGNING_KEY: ${{ secrets.COMPI_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          test -n "$COMPI_UPDATE_PUBLIC_KEY" || { echo 'Missing public verification key repository variable'; exit 1; }
          test -n "$COMPI_UPDATE_SIGNING_KEY" || { echo 'Missing private metadata signing key secret'; exit 1; }
          cargo build --locked --release -p compi-update --bin compi-release-metadata
          # releases/latest/download/Compi-Setup.exe must be the very Setup this release signs.
          cmp distribution/Compi-Setup.exe "distribution/Compi-${RELEASE_TAG#v}-Setup.exe"
          python3 tools/sign-release-metadata.py --distribution distribution --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --signer target/release/compi-release-metadata --notes docs/release-notes.md
          cd distribution
          test -f compi-setup-windows-x86_64.json || { echo 'Missing signed Setup metadata'; exit 1; }
          sha256sum compi-update-*.json compi-setup-*.json >> SHA256SUMS.txt
      - name: Create draft GitHub release for deliberate human publication
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
          files: distribution/*
