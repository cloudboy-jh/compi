[workspace]
resolver = "3"
members = [
    "crates/compi-protocol",
    "crates/compi-terminal",
    "crates/compi-platform",
    "crates/compi-client",
    "crates/compi-daemon",
    "crates/compi-gpui",
]
default-members = [
    "crates/compi-protocol",
    "crates/compi-terminal",
    "crates/compi-platform",
    "crates/compi-client",
    "crates/compi-daemon",
    "crates/compi-gpui",
]
exclude = ["installer/bootstrapper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-channel = "2.5"
bincode = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
vte = "0.15"
smallvec = "1.15"
smol_str = { version = "0.3", features = ["serde"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = "symbols"
