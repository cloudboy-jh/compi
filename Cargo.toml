[workspace]
resolver = "3"
members = [
    "crates/compi-protocol",
    "crates/compi-daemon",
    "crates/compi-client",
    "crates/compi-update",
    "installer/bootstrapper",
    "tools/compi-dev",
]
default-members = [
    "crates/compi-protocol",
    "crates/compi-daemon",
    "crates/compi-client",
]
exclude = ["vendor/gpui-pre-windows"]

[workspace.package]
version = "0.7.3"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
async-channel = "2.5"
bincode = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.1"
unicode-width = "0.2"
unicode-segmentation = "1.12"
vte = "0.15"
smallvec = "1.15"
smol_str = { version = "0.3", features = ["serde"] }
sha2 = "0.10"

[profile.dev]
debug = 1
incremental = false

# No cross-crate LTO: with it, every binary relinks the whole GPUI graph (about a minute
# each) for about 1% smaller files. Setup and maintenance share this profile, and so the
# release build of everything they share with the product.
[profile.release]
strip = "symbols"

# GPUI's Windows platform with one change: its composition target is not topmost, so a
# browser pane's webview (a child window) draws above GPUI. See the comment at
# `CreateTargetForHwnd` in the vendored crate; re-apply it when upgrading GPUI.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
