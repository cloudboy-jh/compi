[package]
name = "compi-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compi-protocol = { path = "../compi-protocol" }
base64.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smol_str.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
vte.workspace = true
portable-pty = "0.9"
parking_lot = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system", "user"] }

[dev-dependencies]
compi-client = { path = "../compi-client" }
base64.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
png = { version = "0.18", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1", default-features = false }
