[package]
name = "compi-client"
version.workspace = true
edition.workspace = true
publish.workspace = true
default-run = "compi"

[dependencies]
compi-protocol = { path = "../compi-protocol" }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
async-channel.workspace = true
base64.workspace = true
smallvec.workspace = true
gpui = { version = "0.2.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Without font-kit, GPUI selects NoopTextSystem on macOS.
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
