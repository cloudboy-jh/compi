[package]
name = "compi-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "compi"

[dependencies]
compi-protocol = { path = "../compi-protocol" }
compi-update = { path = "../compi-update" }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
toml = { version = "0.8", default-features = false, features = ["parse"] }
toml_edit = "0.22"
parking_lot = "0.12"
imara-diff = "0.2"
pulldown-cmark = "=0.13.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
async-channel.workspace = true
base64.workspace = true
smallvec.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.8", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
gpui-component = { version = "=0.7.1", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# GPUI Kit's base layer: its `Confirm` action, which Kit's popovers bind to Enter
# and Space and do not re-export.
gpui-base = "=0.7.2"
gpui-kit-assets = "=0.7.2"
markdown = "=1.0.0"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
mitex = "=0.2.4"
typst = "=0.14.2"
typst-svg = "=0.14.2"
typst-assets = { version = "=0.14.2", features = ["fonts"] }
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
raw-window-handle = "0.6"
# Browser panes: the system webview (WebView2, WKWebView) as a child of the window.
wry = { version = "0.57.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Without font-kit, GPUI selects NoopTextSystem on macOS.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit"] }
objc2 = "0.6"
# Browser panes: a mouse-down monitor (`NSEvent` local monitors take a block).
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.39"

[build-dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
